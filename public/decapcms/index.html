<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta property="og:image" content="https://www.workoutquestapp.com/workout-quest-preview.svg" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: Inter, Arial, sans-serif;
      }

      .shell {
        text-align: center;
        padding: 24px;
      }

      .shell img {
        width: min(100%, 480px);
        height: auto;
        border-radius: 16px;
        display: block;
        margin: 0 auto 16px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <img src="/workout-quest-preview.svg" alt="Workout Quest preview" width="1200" height="630" />
      <p>Loading content manager...</p>
    </div>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  </body>
</html>
